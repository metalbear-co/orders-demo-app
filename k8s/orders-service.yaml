apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: orders-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: orders-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: orders
            - name: PRICING_SERVICE_URL
              value: http://pricing-service:8000
            - name: TOKEN_SERVICE_URL
              value: http://token-service:8100
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: orders-demo
spec:
  selector:
    app: orders-service
  ports:
    - port: 3000
      targetPort: 3000
