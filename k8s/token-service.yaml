apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-service
  namespace: orders-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-service
  template:
    metadata:
      labels:
        app: token-service
    spec:
      containers:
        - name: token-service
          image: token-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          env:
            - name: TOKEN_TTL_SECONDS
              value: "30"
---
apiVersion: v1
kind: Service
metadata:
  name: token-service
  namespace: orders-demo
spec:
  selector:
    app: token-service
  ports:
    - port: 8100
      targetPort: 8100
