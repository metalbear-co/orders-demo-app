apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: orders-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: pricing-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: orders-demo
spec:
  selector:
    app: pricing-service
  ports:
    - port: 8000
      targetPort: 8000
